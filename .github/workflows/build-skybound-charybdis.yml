name: 'Build Skybound Charybdis'
on:
  workflow_dispatch:
    inputs:
      alphas:
        description: 'Alpha layout'
        type: choice
        default: 'default'
        options:
          - default
          - COLEMAKDH
          - QWERTY
          - WORKMAN
          - CANARY
          - DVORAK
jobs:
  build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano//zmk"]'
      shield: '["charybdis_left","charybdis_right"]'
      alphas: '["${{ inputs.alphas || ''default'' }}"]'
