name: 'Build Skybound Corne'
on:
  workflow_dispatch:
    inputs:
      alphas:
        description: 'Alpha layout'
        type: choice
        default: 'default'
        options:
          - default
          - COLEMAKDH
          - QWERTY
          - WORKMAN
          - CANARY
          - DVORAK
jobs:
  build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano//zmk"]'
      shield: '["corne_left nice_view_adapter nice_view","corne_right nice_view_adapter nice_view"]'
      alphas: '["${{ inputs.alphas || ''default'' }}"]'
